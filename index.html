<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lumosmax · Projects</title>
  <meta name="description" content="Selected projects, things I've designed, built, and shipped." />
  <meta name="theme-color" content="#2d96bd" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='70'>l</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&family=Fira+Code&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="css/style.css?v=6" />
</head>
<body>
  <header class="site">
    <div class="wrap nav">
      <a class="brand" href="index.html">lumosmax</a>
      <nav class="nav-links">
        <a href="index.html" class="active">Projects</a>
        <a href="about.html">About</a>
        <a href="about.html#contact">Contact</a>
        <button class="theme-toggle" aria-label="Toggle theme"><i class="fa-solid fa-moon"></i></button>
      </nav>
    </div>
  </header>

  <main>
    <div class="wrap wide">
      <div class="page-head reveal">
        <h1>Projects</h1>
        <p>Things I've designed, built, and shipped, pulled live from GitHub.</p>
      </div>

      <div class="projects-layout">
        <!-- ===== LEFT RAIL ===== -->
        <aside class="rail reveal">
          <div class="rail-group">
            <p class="rail-label">Category</p>
            <div class="filter-bar">
              <button class="filter-btn active" data-filter="all">All works</button>
              <button class="filter-btn" data-filter="embedded">Embedded</button>
              <button class="filter-btn" data-filter="iot">IoT</button>
              <button class="filter-btn" data-filter="robotics">Robotics</button>
              <button class="filter-btn" data-filter="software">Software</button>
              <button class="filter-btn" data-filter="fun">Fun</button>
            </div>
          </div>

          <div class="rail-group">
            <p class="rail-label">Status</p>
            <nav class="rail-status" id="rail-status">
              <a href="#s-done" class="st-done"><i class="fa-solid fa-circle-check"></i>Done<span class="n" data-count="done">0</span></a>
              <a href="#s-brewing" class="st-brewing"><i class="fa-solid fa-mug-hot"></i>Brewing<span class="n" data-count="brewing">0</span></a>
              <a href="#s-idea" class="st-idea"><i class="fa-solid fa-lightbulb"></i>Ideas<span class="n" data-count="idea">0</span></a>
            </nav>
          </div>
        </aside>

        <!-- Projects render here (see js/projects-config.js to add projects) -->
        <div id="projects-root">
          <p class="loading"><i class="fa-solid fa-spinner fa-spin"></i> Loading projects…</p>
        </div>
      </div>
    </div>
  </main>

  <footer class="site">
    <div class="wrap">
      <div class="socials">
        <a href="https://github.com/lumosmaximus" target="_blank" rel="noopener" aria-label="GitHub"><i class="fa-brands fa-github"></i></a>
        <a href="https://www.linkedin.com/in/doraditya" target="_blank" rel="noopener" aria-label="LinkedIn"><i class="fa-brands fa-linkedin"></i></a>
        <a href="mailto:info@lumosmax.dev" aria-label="Email"><i class="fa-solid fa-envelope"></i></a>
      </div>
      <div>© <span id="year"></span> Lumosmax</div>
    </div>
  </footer>

  <script src="js/main.js?v=6"></script>
  <script src="js/projects-config.js?v=6"></script>
  <script src="js/projects.js?v=6"></script>
</body>
</html>
